name: 📦 Build Release APK

# Builds a signed, universal (all-ABI) release APK of anki-viktor and,
# when triggered by a version tag, publishes it to a GitHub Release.
#
#   - Push a tag like `v2.24.0-viktor.1`  -> builds + creates a GitHub Release with the APK
#   - Run manually (workflow_dispatch)     -> builds + uploads the APK as a downloadable artifact
#
# The Rust backend is NOT compiled here: it is consumed as the prebuilt
# `Anki-Android-Backend` Maven dependency (see AnkiDroid/build.gradle), so this
# is a plain JDK 21 + Android SDK + Gradle build.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Needed so the built-in GITHUB_TOKEN can create a Release.
permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Configure JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed universal release APK
        env:
          # Consumed by signingConfigs.release in AnkiDroid/build.gradle
          KEYSTOREPATH: ${{ runner.temp }}/release.jks
          KEYSTOREPWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYALIAS: ${{ secrets.KEY_ALIAS }}
          KEYPWD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleFullRelease -Duniversal-apk=true

      - name: Locate universal APK
        id: apk
        run: |
          DIR=AnkiDroid/build/outputs/apk/full/release
          APK=$(find "$DIR" -name '*universal*.apk' | head -1)
          [ -z "$APK" ] && APK=$(find "$DIR" -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "::error::No APK produced in $DIR"; exit 1; fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: anki-viktor-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.apk.outputs.path }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
